<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buffy MMORPG - Sunnydale 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0033 0%, #4d0000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .loading-bar {
            width: 400px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ff0000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6600, #ffff00);
            width: 0%;
            transition: width 0.3s;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(139, 0, 0, 0.8);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(5px);
        }

        #stats-panel {
            top: 20px;
            left: 20px;
            min-width: 250px;
        }

        .stat-bar {
            margin: 8px 0;
        }

        .stat-label {
            font-size: 12px;
            margin-bottom: 3px;
            color: #ff6600;
            text-transform: uppercase;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #fff;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s;
            border-radius: 10px;
        }

        .health-bar { background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00); }
        .stamina-bar { background: linear-gradient(90deg, #00ffff, #0080ff); }
        .xp-bar { background: linear-gradient(90deg, #ff00ff, #8000ff); }

        #minimap {
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
        }

        #controls-help {
            bottom: 20px;
            left: 20px;
            font-size: 11px;
            max-width: 250px;
        }

        .control-row {
            margin: 2px 0;
            opacity: 0.8;
        }

        .control-key {
            background: rgba(255, 102, 0, 0.3);
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 9px;
        }

        #message {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border: 2px solid #ff6600;
            border-radius: 10px;
            font-size: 16px;
            white-space: nowrap;
            pointer-events: none;
        }

        .damage-number {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            animation: damageFloat 1s forwards;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }

        @keyframes damageFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.5);
            }
        }

        .damage-critical { color: #ff0000; font-size: 32px; }
        .damage-normal { color: #ffff00; }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loading-title">🧛 BUFFY MMORPG 🧛</div>
        <div style="font-size: 24px; margin-bottom: 30px;">SUNNYDALE AWAITS...</div>
        <div class="loading-bar">
            <div class="loading-fill" id="loadingFill"></div>
        </div>
        <div id="loadingText">Loading...</div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
        <!-- Stats Panel -->
        <div id="stats-panel" class="hud-panel">
            <div style="font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #ff6600;">
                BUFFY - LVL <span id="player-level">1</span>
            </div>
            <div class="stat-bar">
                <div class="stat-label">Health: <span id="health-value">100/100</span></div>
                <div class="bar-container">
                    <div class="bar-fill health-bar" id="health-bar" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <div class="stat-label">Stamina: <span id="stamina-value">100/100</span></div>
                <div class="bar-container">
                    <div class="bar-fill stamina-bar" id="stamina-bar" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <div class="stat-label">XP: <span id="xp-value">0/100</span></div>
                <div class="bar-container">
                    <div class="bar-fill xp-bar" id="xp-bar" style="width: 0%"></div>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 12px;">
                <div>Kills: <span id="kills">0</span></div>
                <div>Gold: <span id="gold">0</span> 💰</div>
            </div>
        </div>

        <!-- Minimap -->
        <div id="minimap" class="hud-panel">
            <canvas id="minimap-canvas" width="196" height="196"></canvas>
        </div>

        <!-- Controls Help -->
        <div id="controls-help" class="hud-panel">
            <div style="font-weight: bold; margin-bottom: 5px; color: #ff6600;">CONTROLS</div>
            <div class="control-row"><span class="control-key">WASD</span> Move</div>
            <div class="control-row"><span class="control-key">MOUSE</span> Look</div>
            <div class="control-row"><span class="control-key">SHIFT</span> Sprint</div>
            <div class="control-row"><span class="control-key">SPACE</span> Jump</div>
            <div class="control-row"><span class="control-key">CLICK</span> Attack</div>
            <div class="control-row"><span class="control-key">E</span> Interact</div>
        </div>

        <!-- Crosshair -->
        <div id="crosshair"></div>

        <!-- Message -->
        <div id="message" style="display: none;"></div>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Game Class
        class BuffyMMORPG {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.loadingFill = document.getElementById('loadingFill');
                this.loadingText = document.getElementById('loadingText');

                // Game objects
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.player = null;
                this.enemies = [];
                this.npcs = [];
                this.buildings = [];

                // Player stats
                this.stats = {
                    level: 1,
                    health: 100,
                    maxHealth: 100,
                    stamina: 100,
                    maxStamina: 100,
                    xp: 0,
                    xpToLevel: 100,
                    kills: 0,
                    gold: 0
                };

                // Controls
                this.keys = {};
                this.mouse = { x: 0, y: 0, locked: false };
                this.velocity = new THREE.Vector3();
                this.canAttack = true;

                // Constants
                this.WORLD_SIZE = 300;
                this.PLAYER_SPEED = 10;
                this.SPRINT_MULT = 1.8;
                this.JUMP_FORCE = 10;
                this.GRAVITY = -25;

                // Clock
                this.clock = new THREE.Clock();
                this.raycaster = new THREE.Raycaster();

                this.init();
            }

            updateLoading(percent, text) {
                this.loadingFill.style.width = percent + '%';
                this.loadingText.textContent = text;
            }

            init() {
                this.updateLoading(10, 'Creating 3D Engine...');

                setTimeout(() => {
                    this.createScene();
                    this.updateLoading(30, 'Building Sunnydale...');

                    setTimeout(() => {
                        this.createWorld();
                        this.updateLoading(50, 'Spawning Vampires...');

                        setTimeout(() => {
                            this.createEnemies();
                            this.updateLoading(70, 'Adding NPCs...');

                            setTimeout(() => {
                                this.createNPCs();
                                this.updateLoading(90, 'Ready!');

                                setTimeout(() => {
                                    this.setupControls();
                                    this.startGame();
                                }, 300);
                            }, 300);
                        }, 300);
                    }, 300);
                }, 300);
            }

            createScene() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0a1a);
                this.scene.fog = new THREE.Fog(0x0a0a1a, 50, 200);

                // Camera
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 5, 10);

                // Renderer
                this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;

                // Lights
                const ambient = new THREE.AmbientLight(0x404060, 0.5);
                this.scene.add(ambient);

                const moonLight = new THREE.DirectionalLight(0x8888ff, 0.8);
                moonLight.position.set(50, 100, 50);
                moonLight.castShadow = true;
                moonLight.shadow.mapSize.width = 1024;
                moonLight.shadow.mapSize.height = 1024;
                moonLight.shadow.camera.left = -100;
                moonLight.shadow.camera.right = 100;
                moonLight.shadow.camera.top = 100;
                moonLight.shadow.camera.bottom = -100;
                this.scene.add(moonLight);

                window.addEventListener('resize', () => this.onResize());
            }

            createWorld() {
                // Ground
                const ground = new THREE.Mesh(
                    new THREE.PlaneGeometry(this.WORLD_SIZE, this.WORLD_SIZE),
                    new THREE.MeshStandardMaterial({ color: 0x1a4d1a })
                );
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Buildings
                this.createBuilding(-30, -40, 15, 20, 12, 0x8b4513, "The Bronze");
                this.createBuilding(20, -40, 12, 15, 10, 0x654321, "Espresso Pump");
                this.createBuilding(-50, -60, 20, 25, 15, 0x696969, "Sunnydale High");
                this.createBuilding(40, -50, 10, 12, 10, 0x8b7355, "Magic Shop");
                this.createBuilding(-15, -70, 14, 18, 12, 0x556b2f, "Library");

                // Houses
                for (let i = 0; i < 10; i++) {
                    const x = (Math.random() - 0.5) * 120;
                    const z = (Math.random() - 0.5) * 120 + 30;
                    if (Math.abs(x) > 20 || z > 0) {
                        this.createBuilding(x, z, 10, 10, 10, 0x8b6914, "House");
                    }
                }

                // Street lamps
                for (let i = -60; i < 60; i += 25) {
                    this.createLamp(i, -30);
                }

                // Cemetery
                for (let i = 0; i < 20; i++) {
                    const x = 60 + (Math.random() - 0.5) * 30;
                    const z = -60 + (Math.random() - 0.5) * 30;
                    this.createTombstone(x, z);
                }

                // Trees
                for (let i = 0; i < 50; i++) {
                    const x = (Math.random() - 0.5) * this.WORLD_SIZE * 0.8;
                    const z = (Math.random() - 0.5) * this.WORLD_SIZE * 0.8;
                    if (Math.abs(x) > 30 || Math.abs(z) > 30) {
                        this.createTree(x, z);
                    }
                }

                // Stars
                const starsGeo = new THREE.BufferGeometry();
                const starVerts = [];
                for (let i = 0; i < 2000; i++) {
                    starVerts.push(
                        (Math.random() - 0.5) * 1000,
                        Math.random() * 300 + 100,
                        (Math.random() - 0.5) * 1000
                    );
                }
                starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
                const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1 }));
                this.scene.add(stars);

                // Moon
                const moon = new THREE.Mesh(
                    new THREE.SphereGeometry(10, 32, 32),
                    new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffffaa, emissiveIntensity: 0.5 })
                );
                moon.position.set(80, 120, -80);
                this.scene.add(moon);
            }

            createBuilding(x, z, w, h, d, color, name) {
                const building = new THREE.Mesh(
                    new THREE.BoxGeometry(w, h, d),
                    new THREE.MeshStandardMaterial({ color: color })
                );
                building.position.set(x, h/2, z);
                building.castShadow = true;
                building.receiveShadow = true;
                building.userData = { name: name };
                this.scene.add(building);
                this.buildings.push({ mesh: building, x: x, z: z });

                // Roof
                const roof = new THREE.Mesh(
                    new THREE.ConeGeometry(w * 0.7, h * 0.3, 4),
                    new THREE.MeshStandardMaterial({ color: 0x2d1810 })
                );
                roof.position.set(x, h + h * 0.15, z);
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                this.scene.add(roof);
            }

            createLamp(x, z) {
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.2, 0.3, 6, 8),
                    new THREE.MeshStandardMaterial({ color: 0x333333 })
                );
                pole.position.set(x, 3, z);
                pole.castShadow = true;
                this.scene.add(pole);

                const light = new THREE.PointLight(0xffaa00, 0.8, 25);
                light.position.set(x, 6, z);
                light.castShadow = true;
                this.scene.add(light);

                const bulb = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xffaa00, emissiveIntensity: 1 })
                );
                bulb.position.set(x, 6, z);
                this.scene.add(bulb);
            }

            createTombstone(x, z) {
                const tomb = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 2, 0.3),
                    new THREE.MeshStandardMaterial({ color: 0x505050 })
                );
                tomb.position.set(x, 1, z);
                tomb.castShadow = true;
                tomb.receiveShadow = true;
                this.scene.add(tomb);
            }

            createTree(x, z) {
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.4, 0.6, 5, 8),
                    new THREE.MeshStandardMaterial({ color: 0x4a2511 })
                );
                trunk.position.set(x, 2.5, z);
                trunk.castShadow = true;
                this.scene.add(trunk);

                const leaves = new THREE.Mesh(
                    new THREE.SphereGeometry(2.5, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0x0d4d0d })
                );
                leaves.position.set(x, 6, z);
                leaves.castShadow = true;
                this.scene.add(leaves);
            }

            createPlayer() {
                this.player = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.5, 1.5, 8, 16),
                    new THREE.MeshStandardMaterial({ color: 0xff6699 })
                );
                this.player.position.set(0, 1, 0);
                this.player.castShadow = true;
                this.scene.add(this.player);

                // Head
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffcc99 })
                );
                head.position.set(0, 1.3, 0);
                this.player.add(head);

                // Weapon
                this.weapon = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.1, 1, 8),
                    new THREE.MeshStandardMaterial({ color: 0x8b4513 })
                );
                this.weapon.position.set(0.5, 0.5, 0);
                this.weapon.rotation.z = Math.PI / 4;
                this.player.add(this.weapon);
            }

            createEnemies() {
                const spawns = [
                    [60, -60], [50, 50], [-60, 40], [-50, -70], [30, 70]
                ];

                spawns.forEach(([x, z]) => {
                    for (let i = 0; i < 2; i++) {
                        const ex = x + (Math.random() - 0.5) * 15;
                        const ez = z + (Math.random() - 0.5) * 15;
                        this.createVampire(ex, ez);
                    }
                });
            }

            createVampire(x, z) {
                const vampire = new THREE.Group();

                const body = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.5, 1.5, 8, 16),
                    new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
                );
                body.castShadow = true;
                vampire.add(body);

                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
                );
                head.position.set(0, 1.3, 0);
                vampire.add(head);

                // Red glowing eyes
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 1 });
                const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
                leftEye.position.set(-0.15, 1.4, 0.35);
                vampire.add(leftEye);

                const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
                rightEye.position.set(0.15, 1.4, 0.35);
                vampire.add(rightEye);

                vampire.position.set(x, 1, z);
                vampire.userData = {
                    type: 'vampire',
                    health: 50,
                    maxHealth: 50,
                    speed: 3,
                    damage: 10,
                    state: 'idle',
                    lastAttack: 0
                };

                this.scene.add(vampire);
                this.enemies.push(vampire);
            }

            createNPCs() {
                this.createNPC(-15, -70, 'Giles', 0x8b7355);
                this.createNPC(-50, -60, 'Willow', 0xff6699);
                this.createNPC(-30, -35, 'Xander', 0x4169e1);
            }

            createNPC(x, z, name, color) {
                const npc = new THREE.Group();

                const body = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.5, 1.5, 8, 16),
                    new THREE.MeshStandardMaterial({ color: color })
                );
                body.castShadow = true;
                npc.add(body);

                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffcc99 })
                );
                head.position.set(0, 1.3, 0);
                npc.add(head);

                npc.position.set(x, 1, z);
                npc.userData = { type: 'npc', name: name };

                this.scene.add(npc);
                this.npcs.push(npc);
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key.toLowerCase()] = true;
                    if (e.key === 'e' || e.key === 'E') this.interact();
                });

                document.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                });

                document.addEventListener('click', () => {
                    if (!this.mouse.locked) {
                        this.canvas.requestPointerLock();
                    } else {
                        this.attack();
                    }
                });

                document.addEventListener('pointerlockchange', () => {
                    this.mouse.locked = document.pointerLockElement === this.canvas;
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.mouse.locked) {
                        this.mouse.x -= e.movementX * 0.002;
                        this.mouse.y -= e.movementY * 0.002;
                        this.mouse.y = Math.max(-Math.PI/2, Math.min(Math.PI/2, this.mouse.y));
                    }
                });
            }

            interact() {
                if (!this.player) return;

                for (let npc of this.npcs) {
                    const dist = this.player.position.distanceTo(npc.position);
                    if (dist < 5) {
                        this.showMessage(`${npc.userData.name}: Hello Buffy!`);
                        return;
                    }
                }
            }

            attack() {
                if (!this.canAttack) return;

                this.canAttack = false;
                setTimeout(() => { this.canAttack = true; }, 500);

                // Weapon animation
                if (this.weapon) {
                    const orig = this.weapon.rotation.z;
                    this.weapon.rotation.z = Math.PI / 2;
                    setTimeout(() => { this.weapon.rotation.z = orig; }, 200);
                }

                // Check hits
                this.raycaster.setFromCamera({ x: 0, y: 0 }, this.camera);
                const intersects = this.raycaster.intersectObjects(this.scene.children, true);

                for (let hit of intersects) {
                    let obj = hit.object;
                    while (obj.parent && !obj.userData.type) obj = obj.parent;

                    if (obj.userData.type === 'vampire' && hit.distance < 5) {
                        const isCrit = Math.random() < 0.2;
                        const damage = isCrit ? 50 : 25;
                        obj.userData.health -= damage;

                        this.showDamage(obj.position, damage, isCrit);

                        if (obj.userData.health <= 0) {
                            this.scene.remove(obj);
                            this.enemies = this.enemies.filter(e => e !== obj);
                            this.stats.xp += 50;
                            this.stats.gold += 15;
                            this.stats.kills++;
                            this.checkLevelUp();
                            this.updateHUD();

                            // Respawn
                            setTimeout(() => {
                                const x = (Math.random() - 0.5) * 100;
                                const z = (Math.random() - 0.5) * 100;
                                this.createVampire(x, z);
                            }, 8000);
                        }
                        break;
                    }
                }

                this.stats.stamina = Math.max(0, this.stats.stamina - 10);
                this.updateHUD();
            }

            showDamage(pos, damage, crit) {
                const div = document.createElement('div');
                div.className = 'damage-number ' + (crit ? 'damage-critical' : 'damage-normal');
                div.textContent = crit ? 'CRIT! ' + damage : damage;

                const vector = pos.clone().project(this.camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (vector.y * -0.5 + 0.5) * window.innerHeight;

                div.style.left = x + 'px';
                div.style.top = y + 'px';
                document.getElementById('hud').appendChild(div);

                setTimeout(() => div.remove(), 1000);
            }

            showMessage(text) {
                const msg = document.getElementById('message');
                msg.textContent = text;
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            }

            checkLevelUp() {
                if (this.stats.xp >= this.stats.xpToLevel) {
                    this.stats.level++;
                    this.stats.xp = 0;
                    this.stats.xpToLevel = Math.floor(this.stats.xpToLevel * 1.5);
                    this.stats.maxHealth += 20;
                    this.stats.health = this.stats.maxHealth;
                    this.showMessage(`LEVEL UP! Now level ${this.stats.level}!`);
                }
            }

            updateHUD() {
                document.getElementById('player-level').textContent = this.stats.level;
                document.getElementById('health-value').textContent = `${Math.floor(this.stats.health)}/${this.stats.maxHealth}`;
                document.getElementById('health-bar').style.width = (this.stats.health / this.stats.maxHealth * 100) + '%';
                document.getElementById('stamina-value').textContent = `${Math.floor(this.stats.stamina)}/${this.stats.maxStamina}`;
                document.getElementById('stamina-bar').style.width = (this.stats.stamina / this.stats.maxStamina * 100) + '%';
                document.getElementById('xp-value').textContent = `${Math.floor(this.stats.xp)}/${this.stats.xpToLevel}`;
                document.getElementById('xp-bar').style.width = (this.stats.xp / this.stats.xpToLevel * 100) + '%';
                document.getElementById('kills').textContent = this.stats.kills;
                document.getElementById('gold').textContent = this.stats.gold;
            }

            updateMinimap() {
                const canvas = document.getElementById('minimap-canvas');
                const ctx = canvas.getContext('2d');
                const scale = 196 / this.WORLD_SIZE;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 196, 196);

                // Buildings
                ctx.fillStyle = '#666';
                this.buildings.forEach(b => {
                    const x = (b.x + this.WORLD_SIZE/2) * scale;
                    const y = (b.z + this.WORLD_SIZE/2) * scale;
                    ctx.fillRect(x - 2, y - 2, 4, 4);
                });

                // Enemies
                ctx.fillStyle = '#f00';
                this.enemies.forEach(e => {
                    const x = (e.position.x + this.WORLD_SIZE/2) * scale;
                    const y = (e.position.z + this.WORLD_SIZE/2) * scale;
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Player
                if (this.player) {
                    const x = (this.player.position.x + this.WORLD_SIZE/2) * scale;
                    const y = (this.player.position.z + this.WORLD_SIZE/2) * scale;
                    ctx.fillStyle = '#0ff';
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            updateEnemies(delta) {
                if (!this.player) return;

                this.enemies.forEach(enemy => {
                    const dist = this.player.position.distanceTo(enemy.position);

                    if (dist < 25 && dist > 2) {
                        // Chase
                        const dir = new THREE.Vector3()
                            .subVectors(this.player.position, enemy.position)
                            .normalize();

                        enemy.position.x += dir.x * enemy.userData.speed * delta;
                        enemy.position.z += dir.z * enemy.userData.speed * delta;
                        enemy.lookAt(this.player.position);
                    } else if (dist <= 2) {
                        // Attack
                        const now = Date.now();
                        if (now - enemy.userData.lastAttack > 1500) {
                            enemy.userData.lastAttack = now;
                            this.stats.health -= enemy.userData.damage;
                            this.updateHUD();

                            if (this.stats.health <= 0) {
                                this.showMessage('GAME OVER! Click to respawn');
                                this.stats.health = this.stats.maxHealth;
                                this.player.position.set(0, 1, 0);
                            }
                        }
                    }
                });
            }

            startGame() {
                document.getElementById('loading').classList.add('hidden');
                this.createPlayer();
                this.showMessage('Welcome to Sunnydale! Click to lock mouse and start playing!');
                this.updateHUD();

                // Stamina regen
                setInterval(() => {
                    if (this.stats.stamina < this.stats.maxStamina) {
                        this.stats.stamina = Math.min(this.stats.maxStamina, this.stats.stamina + 2);
                        this.updateHUD();
                    }
                }, 100);

                this.animate();
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const delta = this.clock.getDelta();

                if (this.player && this.mouse.locked) {
                    this.updatePlayer(delta);
                    this.updateEnemies(delta);
                    this.updateCamera();
                    this.updateMinimap();
                }

                this.renderer.render(this.scene, this.camera);
            }

            updatePlayer(delta) {
                const speed = this.PLAYER_SPEED * (this.keys['shift'] ? this.SPRINT_MULT : 1);

                let moveX = 0, moveZ = 0;
                if (this.keys['w']) moveZ = -1;
                if (this.keys['s']) moveZ = 1;
                if (this.keys['a']) moveX = -1;
                if (this.keys['d']) moveX = 1;

                if (moveX !== 0 || moveZ !== 0) {
                    const angle = Math.atan2(moveX, moveZ) + this.mouse.x;
                    this.velocity.x = Math.sin(angle) * speed;
                    this.velocity.z = Math.cos(angle) * speed;
                } else {
                    this.velocity.x = 0;
                    this.velocity.z = 0;
                }

                // Jump
                if (this.keys[' '] && this.player.position.y <= 1.1) {
                    this.velocity.y = this.JUMP_FORCE;
                }

                // Gravity
                this.velocity.y += this.GRAVITY * delta;

                // Apply velocity
                this.player.position.x += this.velocity.x * delta;
                this.player.position.z += this.velocity.z * delta;
                this.player.position.y += this.velocity.y * delta;

                // Ground
                if (this.player.position.y < 1) {
                    this.player.position.y = 1;
                    this.velocity.y = 0;
                }

                // Boundaries
                const max = this.WORLD_SIZE / 2 - 5;
                this.player.position.x = Math.max(-max, Math.min(max, this.player.position.x));
                this.player.position.z = Math.max(-max, Math.min(max, this.player.position.z));

                // Use stamina when sprinting
                if (this.keys['shift'] && (moveX !== 0 || moveZ !== 0)) {
                    this.stats.stamina = Math.max(0, this.stats.stamina - 15 * delta);
                    if (this.stats.stamina <= 0) this.keys['shift'] = false;
                }
            }

            updateCamera() {
                const dist = 7;
                const height = 3;

                const offset = new THREE.Vector3(
                    Math.sin(this.mouse.x) * dist,
                    height + Math.sin(this.mouse.y) * 2,
                    Math.cos(this.mouse.x) * dist
                );

                this.camera.position.copy(this.player.position).add(offset);
                this.camera.lookAt(this.player.position.x, this.player.position.y + 1, this.player.position.z);
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // Start game
        window.addEventListener('load', () => {
            new BuffyMMORPG();
        });
    </script>
</body>
</html>
