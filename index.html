<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buffy MMORPG - Sunnydale 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0033 0%, #4d0000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        #loading.hidden {
            display: none;
        }

        .loading-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .loading-text {
            font-size: 20px;
            color: #ff6600;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(139, 0, 0, 0.8);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(5px);
        }

        #stats-panel {
            top: 20px;
            left: 20px;
            min-width: 220px;
        }

        .stat-bar {
            margin: 5px 0;
        }

        .stat-label {
            font-size: 11px;
            margin-bottom: 2px;
            color: #ff6600;
            text-transform: uppercase;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            height: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .health-bar { background: #ff0000; }
        .stamina-bar { background: #00ffff; }
        .xp-bar { background: #ff00ff; }

        #minimap {
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
        }

        #controls {
            bottom: 20px;
            left: 20px;
            font-size: 11px;
        }

        .control-row {
            margin: 2px 0;
        }

        .key {
            background: rgba(255, 102, 0, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 9px;
        }

        #message {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 12px 25px;
            border: 2px solid #ff6600;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            pointer-events: none;
        }

        .damage-num {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            animation: floatUp 1s forwards;
        }

        .damage-num.crit {
            color: #ff0000;
            font-size: 32px;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loading-title">🧛 BUFFY MMORPG 🧛</div>
        <div class="loading-text">SUNNYDALE AWAITS...</div>
        <div class="loading-text" style="margin-top: 20px;" id="loadStatus">Loading Three.js...</div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" style="display: none;">
        <div id="stats-panel" class="hud-panel">
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #ff6600;">
                BUFFY - LVL <span id="level">1</span>
            </div>
            <div class="stat-bar">
                <div class="stat-label">Health: <span id="hp">100/100</span></div>
                <div class="bar-container">
                    <div class="bar-fill health-bar" id="hpBar" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <div class="stat-label">Stamina: <span id="stam">100/100</span></div>
                <div class="bar-container">
                    <div class="bar-fill stamina-bar" id="stamBar" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <div class="stat-label">XP: <span id="xp">0/100</span></div>
                <div class="bar-container">
                    <div class="bar-fill xp-bar" id="xpBar" style="width: 0%"></div>
                </div>
            </div>
            <div style="margin-top: 8px; font-size: 11px;">
                <div>Kills: <span id="kills">0</span></div>
                <div>Gold: <span id="gold">0</span> 💰</div>
            </div>
        </div>

        <div id="minimap" class="hud-panel">
            <canvas id="minimap-canvas" width="150" height="150"></canvas>
        </div>

        <div id="controls" class="hud-panel">
            <div style="font-weight: bold; margin-bottom: 3px; color: #ff6600;">CONTROLS</div>
            <div class="control-row"><span class="key">WASD</span> Move</div>
            <div class="control-row"><span class="key">MOUSE</span> Look</div>
            <div class="control-row"><span class="key">SHIFT</span> Sprint</div>
            <div class="control-row"><span class="key">SPACE</span> Jump</div>
            <div class="control-row"><span class="key">CLICK</span> Attack</div>
            <div class="control-row"><span class="key">E</span> Interact</div>
        </div>

        <div id="crosshair"></div>
        <div id="message"></div>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>

    <script>
        // Wait for Three.js to load
        function waitForThree() {
            return new Promise((resolve) => {
                if (typeof THREE !== 'undefined') {
                    resolve();
                } else {
                    const interval = setInterval(() => {
                        if (typeof THREE !== 'undefined') {
                            clearInterval(interval);
                            resolve();
                        }
                    }, 100);
                }
            });
        }

        // Main Game Class
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.player = null;
                this.enemies = [];
                this.npcs = [];
                this.buildings = [];

                this.stats = {
                    level: 1,
                    hp: 100,
                    maxHp: 100,
                    stam: 100,
                    maxStam: 100,
                    xp: 0,
                    xpNext: 100,
                    kills: 0,
                    gold: 0
                };

                this.keys = {};
                this.mouse = { x: 0, y: 0, locked: false };
                this.velocity = new THREE.Vector3();
                this.canAttack = true;

                this.WORLD = 200;
                this.SPEED = 8;
                this.SPRINT = 1.5;
                this.JUMP = 8;
                this.GRAV = -20;

                this.clock = new THREE.Clock();
                this.raycaster = new THREE.Raycaster();
            }

            log(msg) {
                document.getElementById('loadStatus').textContent = msg;
                console.log(msg);
            }

            async init() {
                try {
                    this.log('Waiting for Three.js...');
                    await waitForThree();

                    this.log('Creating scene...');
                    this.createScene();

                    this.log('Building world...');
                    this.createWorld();

                    this.log('Creating player...');
                    this.createPlayer();

                    this.log('Spawning enemies...');
                    this.createEnemies();

                    this.log('Adding NPCs...');
                    this.createNPCs();

                    this.log('Setting up controls...');
                    this.setupControls();

                    this.log('Starting game...');
                    this.startGame();
                } catch (error) {
                    this.log('ERROR: ' + error.message);
                    console.error(error);
                }
            }

            createScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0a1a);
                this.scene.fog = new THREE.Fog(0x0a0a1a, 30, 150);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
                this.camera.position.set(0, 5, 10);

                this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;

                const ambient = new THREE.AmbientLight(0x404060, 0.6);
                this.scene.add(ambient);

                const moon = new THREE.DirectionalLight(0x8888ff, 0.8);
                moon.position.set(50, 100, 50);
                moon.castShadow = true;
                moon.shadow.mapSize.width = 512;
                moon.shadow.mapSize.height = 512;
                moon.shadow.camera.left = -80;
                moon.shadow.camera.right = 80;
                moon.shadow.camera.top = 80;
                moon.shadow.camera.bottom = -80;
                this.scene.add(moon);

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            createWorld() {
                // Ground
                const ground = new THREE.Mesh(
                    new THREE.PlaneGeometry(this.WORLD, this.WORLD),
                    new THREE.MeshStandardMaterial({ color: 0x1a4d1a })
                );
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Buildings
                this.addBuilding(-25, -30, 12, 15, 10, 0x8b4513, "The Bronze");
                this.addBuilding(15, -30, 10, 12, 8, 0x654321, "Espresso");
                this.addBuilding(-40, -50, 15, 20, 12, 0x696969, "High School");
                this.addBuilding(30, -40, 8, 10, 8, 0x8b7355, "Magic Shop");
                this.addBuilding(-10, -55, 10, 15, 10, 0x556b2f, "Library");

                // Houses
                for (let i = 0; i < 8; i++) {
                    const x = (Math.random() - 0.5) * 80;
                    const z = (Math.random() - 0.5) * 80 + 20;
                    this.addBuilding(x, z, 8, 8, 8, 0x8b6914, "House");
                }

                // Lamps
                for (let i = -40; i < 40; i += 20) {
                    this.addLamp(i, -25);
                }

                // Cemetery
                for (let i = 0; i < 15; i++) {
                    const x = 50 + (Math.random() - 0.5) * 20;
                    const z = -50 + (Math.random() - 0.5) * 20;
                    this.addTomb(x, z);
                }

                // Trees
                for (let i = 0; i < 30; i++) {
                    const x = (Math.random() - 0.5) * this.WORLD * 0.7;
                    const z = (Math.random() - 0.5) * this.WORLD * 0.7;
                    if (Math.abs(x) > 25 || Math.abs(z) > 25) {
                        this.addTree(x, z);
                    }
                }

                // Stars
                const starsGeo = new THREE.BufferGeometry();
                const verts = [];
                for (let i = 0; i < 1000; i++) {
                    verts.push(
                        (Math.random() - 0.5) * 800,
                        Math.random() * 200 + 100,
                        (Math.random() - 0.5) * 800
                    );
                }
                starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
                const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1 }));
                this.scene.add(stars);

                // Moon
                const moonMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(8, 32, 32),
                    new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffffaa, emissiveIntensity: 0.5 })
                );
                moonMesh.position.set(70, 100, -70);
                this.scene.add(moonMesh);
            }

            addBuilding(x, z, w, h, d, color, name) {
                const building = new THREE.Mesh(
                    new THREE.BoxGeometry(w, h, d),
                    new THREE.MeshStandardMaterial({ color: color })
                );
                building.position.set(x, h/2, z);
                building.castShadow = true;
                building.receiveShadow = true;
                this.scene.add(building);
                this.buildings.push({ x, z });

                const roof = new THREE.Mesh(
                    new THREE.ConeGeometry(w * 0.6, h * 0.25, 4),
                    new THREE.MeshStandardMaterial({ color: 0x2d1810 })
                );
                roof.position.set(x, h + h * 0.12, z);
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                this.scene.add(roof);
            }

            addLamp(x, z) {
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.15, 0.2, 5, 8),
                    new THREE.MeshStandardMaterial({ color: 0x333333 })
                );
                pole.position.set(x, 2.5, z);
                pole.castShadow = true;
                this.scene.add(pole);

                const light = new THREE.PointLight(0xffaa00, 0.6, 20);
                light.position.set(x, 5, z);
                this.scene.add(light);
            }

            addTomb(x, z) {
                const tomb = new THREE.Mesh(
                    new THREE.BoxGeometry(1.2, 1.5, 0.25),
                    new THREE.MeshStandardMaterial({ color: 0x505050 })
                );
                tomb.position.set(x, 0.75, z);
                tomb.castShadow = true;
                this.scene.add(tomb);
            }

            addTree(x, z) {
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.5, 4, 8),
                    new THREE.MeshStandardMaterial({ color: 0x4a2511 })
                );
                trunk.position.set(x, 2, z);
                trunk.castShadow = true;
                this.scene.add(trunk);

                const leaves = new THREE.Mesh(
                    new THREE.SphereGeometry(2, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0x0d4d0d })
                );
                leaves.position.set(x, 5, z);
                leaves.castShadow = true;
                this.scene.add(leaves);
            }

            createPlayer() {
                this.player = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.4, 1.2, 8, 16),
                    new THREE.MeshStandardMaterial({ color: 0xff6699 })
                );
                this.player.position.set(0, 1, 0);
                this.player.castShadow = true;
                this.scene.add(this.player);

                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.35, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffcc99 })
                );
                head.position.y = 1.1;
                this.player.add(head);

                this.weapon = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.04, 0.08, 0.8, 8),
                    new THREE.MeshStandardMaterial({ color: 0x8b4513 })
                );
                this.weapon.position.set(0.4, 0.4, 0);
                this.weapon.rotation.z = Math.PI / 4;
                this.player.add(this.weapon);
            }

            createEnemies() {
                const spawns = [[50, -50], [40, 40], [-50, 35], [-40, -60], [25, 60]];
                spawns.forEach(([x, z]) => {
                    this.addVampire(x, z);
                });
            }

            addVampire(x, z) {
                const vamp = new THREE.Group();

                const body = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.4, 1.2, 8, 16),
                    new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
                );
                body.castShadow = true;
                vamp.add(body);

                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.35, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
                );
                head.position.y = 1.1;
                vamp.add(head);

                const eyeMat = new THREE.MeshStandardMaterial({
                    color: 0xff0000,
                    emissive: 0xff0000,
                    emissiveIntensity: 1
                });

                const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
                leftEye.position.set(-0.12, 1.2, 0.3);
                vamp.add(leftEye);

                const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
                rightEye.position.set(0.12, 1.2, 0.3);
                vamp.add(rightEye);

                vamp.position.set(x, 1, z);
                vamp.userData = {
                    type: 'vampire',
                    hp: 50,
                    maxHp: 50,
                    speed: 2.5,
                    damage: 10,
                    lastAttack: 0
                };

                this.scene.add(vamp);
                this.enemies.push(vamp);
            }

            createNPCs() {
                this.addNPC(-10, -55, 'Giles', 0x8b7355);
                this.addNPC(-40, -50, 'Willow', 0xff6699);
                this.addNPC(-25, -25, 'Xander', 0x4169e1);
            }

            addNPC(x, z, name, color) {
                const npc = new THREE.Group();

                const body = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.4, 1.2, 8, 16),
                    new THREE.MeshStandardMaterial({ color: color })
                );
                body.castShadow = true;
                npc.add(body);

                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.35, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffcc99 })
                );
                head.position.y = 1.1;
                npc.add(head);

                npc.position.set(x, 1, z);
                npc.userData = { type: 'npc', name: name };

                this.scene.add(npc);
                this.npcs.push(npc);
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key.toLowerCase()] = true;
                    if (e.key === 'e' || e.key === 'E') this.interact();
                });

                document.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                });

                document.addEventListener('click', () => {
                    if (!this.mouse.locked) {
                        this.canvas.requestPointerLock();
                    } else {
                        this.attack();
                    }
                });

                document.addEventListener('pointerlockchange', () => {
                    this.mouse.locked = document.pointerLockElement === this.canvas;
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.mouse.locked) {
                        this.mouse.x -= e.movementX * 0.002;
                        this.mouse.y -= e.movementY * 0.002;
                        this.mouse.y = Math.max(-Math.PI/2, Math.min(Math.PI/2, this.mouse.y));
                    }
                });
            }

            interact() {
                if (!this.player) return;
                for (let npc of this.npcs) {
                    const dist = this.player.position.distanceTo(npc.position);
                    if (dist < 4) {
                        this.showMsg(`${npc.userData.name}: Hello Buffy! Hunt some vampires!`);
                        return;
                    }
                }
            }

            attack() {
                if (!this.canAttack) return;

                this.canAttack = false;
                setTimeout(() => { this.canAttack = true; }, 400);

                if (this.weapon) {
                    const orig = this.weapon.rotation.z;
                    this.weapon.rotation.z = Math.PI / 2;
                    setTimeout(() => { this.weapon.rotation.z = orig; }, 150);
                }

                this.raycaster.setFromCamera({ x: 0, y: 0 }, this.camera);
                const hits = this.raycaster.intersectObjects(this.scene.children, true);

                for (let hit of hits) {
                    let obj = hit.object;
                    while (obj.parent && !obj.userData.type) obj = obj.parent;

                    if (obj.userData.type === 'vampire' && hit.distance < 4) {
                        const isCrit = Math.random() < 0.25;
                        const dmg = isCrit ? 50 : 25;
                        obj.userData.hp -= dmg;

                        this.showDmg(obj.position, dmg, isCrit);

                        if (obj.userData.hp <= 0) {
                            this.scene.remove(obj);
                            this.enemies = this.enemies.filter(e => e !== obj);
                            this.stats.xp += 50;
                            this.stats.gold += 12;
                            this.stats.kills++;
                            this.checkLevel();
                            this.updateHUD();

                            setTimeout(() => {
                                const rx = (Math.random() - 0.5) * 80;
                                const rz = (Math.random() - 0.5) * 80;
                                this.addVampire(rx, rz);
                            }, 7000);
                        }
                        break;
                    }
                }

                this.stats.stam = Math.max(0, this.stats.stam - 8);
                this.updateHUD();
            }

            showDmg(pos, dmg, crit) {
                const div = document.createElement('div');
                div.className = 'damage-num' + (crit ? ' crit' : '');
                div.textContent = crit ? 'CRIT! ' + dmg : dmg;

                const vec = pos.clone().project(this.camera);
                const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
                const y = (vec.y * -0.5 + 0.5) * window.innerHeight;

                div.style.left = x + 'px';
                div.style.top = y + 'px';
                document.getElementById('hud').appendChild(div);

                setTimeout(() => div.remove(), 1000);
            }

            showMsg(text) {
                const msg = document.getElementById('message');
                msg.textContent = text;
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 2500);
            }

            checkLevel() {
                if (this.stats.xp >= this.stats.xpNext) {
                    this.stats.level++;
                    this.stats.xp = 0;
                    this.stats.xpNext = Math.floor(this.stats.xpNext * 1.5);
                    this.stats.maxHp += 20;
                    this.stats.hp = this.stats.maxHp;
                    this.showMsg(`LEVEL UP! Now level ${this.stats.level}!`);
                }
            }

            updateHUD() {
                document.getElementById('level').textContent = this.stats.level;
                document.getElementById('hp').textContent = `${Math.floor(this.stats.hp)}/${this.stats.maxHp}`;
                document.getElementById('hpBar').style.width = (this.stats.hp / this.stats.maxHp * 100) + '%';
                document.getElementById('stam').textContent = `${Math.floor(this.stats.stam)}/${this.stats.maxStam}`;
                document.getElementById('stamBar').style.width = (this.stats.stam / this.stats.maxStam * 100) + '%';
                document.getElementById('xp').textContent = `${Math.floor(this.stats.xp)}/${this.stats.xpNext}`;
                document.getElementById('xpBar').style.width = (this.stats.xp / this.stats.xpNext * 100) + '%';
                document.getElementById('kills').textContent = this.stats.kills;
                document.getElementById('gold').textContent = this.stats.gold;
            }

            updateMinimap() {
                const canvas = document.getElementById('minimap-canvas');
                const ctx = canvas.getContext('2d');
                const scale = 150 / this.WORLD;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 150, 150);

                ctx.fillStyle = '#666';
                this.buildings.forEach(b => {
                    const x = (b.x + this.WORLD/2) * scale;
                    const y = (b.z + this.WORLD/2) * scale;
                    ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
                });

                ctx.fillStyle = '#f00';
                this.enemies.forEach(e => {
                    const x = (e.position.x + this.WORLD/2) * scale;
                    const y = (e.position.z + this.WORLD/2) * scale;
                    ctx.beginPath();
                    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                });

                if (this.player) {
                    const x = (this.player.position.x + this.WORLD/2) * scale;
                    const y = (this.player.position.z + this.WORLD/2) * scale;
                    ctx.fillStyle = '#0ff';
                    ctx.beginPath();
                    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            updateEnemies(dt) {
                if (!this.player) return;

                this.enemies.forEach(e => {
                    const dist = this.player.position.distanceTo(e.position);

                    if (dist < 20 && dist > 1.5) {
                        const dir = new THREE.Vector3()
                            .subVectors(this.player.position, e.position)
                            .normalize();
                        e.position.x += dir.x * e.userData.speed * dt;
                        e.position.z += dir.z * e.userData.speed * dt;
                        e.lookAt(this.player.position);
                    } else if (dist <= 1.5) {
                        const now = Date.now();
                        if (now - e.userData.lastAttack > 1200) {
                            e.userData.lastAttack = now;
                            this.stats.hp -= e.userData.damage;
                            this.updateHUD();

                            if (this.stats.hp <= 0) {
                                this.showMsg('DEFEATED! Respawning...');
                                this.stats.hp = this.stats.maxHp;
                                this.player.position.set(0, 1, 0);
                            }
                        }
                    }
                });
            }

            startGame() {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('hud').style.display = 'block';
                this.showMsg('Welcome to Sunnydale! Click to start hunting vampires!');
                this.updateHUD();

                setInterval(() => {
                    if (this.stats.stam < this.stats.maxStam) {
                        this.stats.stam = Math.min(this.stats.maxStam, this.stats.stam + 1.5);
                        this.updateHUD();
                    }
                }, 100);

                this.animate();
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const dt = this.clock.getDelta();

                if (this.player && this.mouse.locked) {
                    this.updatePlayer(dt);
                    this.updateEnemies(dt);
                    this.updateCamera();
                    this.updateMinimap();
                }

                this.renderer.render(this.scene, this.camera);
            }

            updatePlayer(dt) {
                const speed = this.SPEED * (this.keys['shift'] ? this.SPRINT : 1);

                let mx = 0, mz = 0;
                if (this.keys['w']) mz = -1;
                if (this.keys['s']) mz = 1;
                if (this.keys['a']) mx = -1;
                if (this.keys['d']) mx = 1;

                if (mx !== 0 || mz !== 0) {
                    const angle = Math.atan2(mx, mz) + this.mouse.x;
                    this.velocity.x = Math.sin(angle) * speed;
                    this.velocity.z = Math.cos(angle) * speed;
                } else {
                    this.velocity.x = 0;
                    this.velocity.z = 0;
                }

                if (this.keys[' '] && this.player.position.y <= 1.05) {
                    this.velocity.y = this.JUMP;
                }

                this.velocity.y += this.GRAV * dt;

                this.player.position.x += this.velocity.x * dt;
                this.player.position.z += this.velocity.z * dt;
                this.player.position.y += this.velocity.y * dt;

                if (this.player.position.y < 1) {
                    this.player.position.y = 1;
                    this.velocity.y = 0;
                }

                const max = this.WORLD / 2 - 5;
                this.player.position.x = Math.max(-max, Math.min(max, this.player.position.x));
                this.player.position.z = Math.max(-max, Math.min(max, this.player.position.z));

                if (this.keys['shift'] && (mx !== 0 || mz !== 0)) {
                    this.stats.stam = Math.max(0, this.stats.stam - 12 * dt);
                    if (this.stats.stam <= 0) this.keys['shift'] = false;
                }
            }

            updateCamera() {
                const dist = 6;
                const height = 2.5;

                const offset = new THREE.Vector3(
                    Math.sin(this.mouse.x) * dist,
                    height + Math.sin(this.mouse.y) * 1.5,
                    Math.cos(this.mouse.x) * dist
                );

                this.camera.position.copy(this.player.position).add(offset);
                this.camera.lookAt(this.player.position.x, this.player.position.y + 0.8, this.player.position.z);
            }
        }

        // Start the game
        window.addEventListener('load', () => {
            const game = new Game();
            game.init();
        });
    </script>
</body>
</html>
